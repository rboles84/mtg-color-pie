<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanical Color Pie 2021 — data dossier</title>
<style>
:root{
  --bg:#fbfaf7; --bg2:#fff; --bg3:#f2efe9; --ink:#1c1a17; --ink2:#5a544c;
  --line:#ddd6ca; --line2:#c8bfae; --accent:#7a5c1e; --accent-bg:#f6efdc;
  --W:#e8d9a8; --U:#8fb8dd; --B:#8f8a92; --R:#dd9481; --G:#8fbf9a;
  --Wi:#6b5a22; --Ui:#1f4d75; --Bi:#3a3540; --Ri:#7d2e19; --Gi:#1f5c33;
  --pri:#2f6b3a; --sec:#8a6d1f; --ter:#6a5a8a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130f; --bg2:#1c1a16; --bg3:#242019; --ink:#ece7dd; --ink2:#a49c8e;
  --line:#332e26; --line2:#4a4338; --accent:#d9b463; --accent-bg:#2a2318;
  --W:#7a6c3f; --U:#2f5f8a; --B:#4a4550; --R:#8a4a35; --G:#3a6f4a;
  --Wi:#f0e3b8; --Ui:#bcd9f0; --Bi:#d8d2de; --Ri:#f5c0ae; --Gi:#b6e3c2;
  --pri:#7fc48d; --sec:#d9b463; --ter:#b3a3d6;
}}
*{box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);
  -webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;
  max-width:1560px;margin:0 auto}
nav{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;
  padding:22px 14px 40px;border-right:1px solid var(--line);font-size:12.5px}
nav h1{font-size:13px;margin:0 0 4px;letter-spacing:.02em}
nav .sub{color:var(--ink2);font-size:11px;margin:0 0 16px;line-height:1.4}
nav ol{list-style:none;margin:0;padding:0;counter-reset:s}
nav li{counter-increment:s}
nav a{display:block;padding:4px 8px;border-radius:5px;text-decoration:none;
  color:var(--ink2);border-left:2px solid transparent}
nav a::before{content:counter(s) ". ";color:var(--line2)}
nav a:hover{background:var(--bg3);color:var(--ink)}
nav a.on{background:var(--accent-bg);color:var(--ink);border-left-color:var(--accent)}
main{padding:26px 30px 120px;min-width:0}
section{margin:0 0 46px;scroll-margin-top:16px}
h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
h2 .num{color:var(--line2);font-variant-numeric:tabular-nums;margin-right:8px}
h3{font-size:14px;margin:26px 0 8px;letter-spacing:.02em;text-transform:uppercase;
  color:var(--ink2)}
.lede{color:var(--ink2);max-width:78ch;margin:0 0 18px}
p{max-width:82ch}
code,kbd{font-family:var(--mono);font-size:.88em;background:var(--bg3);
  padding:1px 5px;border-radius:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;
  background:var(--bg2)}
table{border-collapse:collapse;width:100%;font-size:12.5px;
  font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top}
thead th{background:var(--bg3);font-weight:600;
  white-space:nowrap;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink2)}
/* Sticky only inside a wrapper that actually scrolls; on a page-flow table a
   sticky header detaches from its own table and floats over the next section. */
.tbl-wrap.scrolls thead th{position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg3)}
td.n,th.n{text-align:right;font-family:var(--mono)}
.mono{font-family:var(--mono);font-size:12px}
.dim{color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
  gap:10px;margin:14px 0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px}
.card b{display:block;font-size:23px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.15}
.card span{display:block;font-size:11.5px;color:var(--ink2);margin-top:3px;
  line-height:1.35}
.note{border-left:3px solid var(--accent);background:var(--accent-bg);
  padding:11px 14px;border-radius:0 7px 7px 0;margin:14px 0;max-width:88ch}
.note b{display:block;margin-bottom:3px}
.warn{border-left-color:var(--Ri)}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  border:1px solid var(--line2);white-space:nowrap}
.c{display:inline-flex;width:19px;height:19px;border-radius:50%;
  align-items:center;justify-content:center;font-size:11px;font-weight:700;
  font-family:var(--mono);border:1px solid rgba(0,0,0,.14)}
.cW{background:var(--W);color:var(--Wi)} .cU{background:var(--U);color:var(--Ui)}
.cB{background:var(--B);color:var(--Bi)} .cR{background:var(--R);color:var(--Ri)}
.cG{background:var(--G);color:var(--Gi)}
.t-primary{color:var(--pri);font-weight:600}
.t-secondary{color:var(--sec);font-weight:600}
.t-tertiary{color:var(--ter);font-weight:600}
.bar{height:7px;border-radius:4px;background:var(--bg3);overflow:hidden;
  min-width:60px}
.bar i{display:block;height:100%;background:var(--line2)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
input[type=search],select{font:inherit;font-size:12.5px;padding:5px 9px;
  border:1px solid var(--line2);border-radius:6px;background:var(--bg2);
  color:var(--ink)}
input[type=search]{min-width:230px}
.count{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-radius:8px;background:var(--bg2);
  padding:9px 13px;margin:9px 0}
details>summary{cursor:pointer;font-weight:600;font-size:13px}
details[open]>summary{margin-bottom:9px}
pre{overflow:auto;background:var(--bg3);padding:11px;border-radius:7px;
  font-family:var(--mono);font-size:11.5px;margin:0;line-height:1.45}
.pipe{display:grid;gap:9px;margin:16px 0}
.pipe .row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;
  align-items:start;background:var(--bg2);border:1px solid var(--line);
  border-radius:8px;padding:10px 13px}
.pipe .lv{font-family:var(--mono);font-size:11px;color:var(--accent);
  font-weight:700;letter-spacing:.04em;padding-top:2px}
.pipe .row b{display:block;font-size:13px;margin-bottom:2px}
.pipe .row p{margin:0;font-size:12.5px;color:var(--ink2);max-width:none}
.pipe .row .fl{margin-top:6px;font-family:var(--mono);font-size:11px;
  color:var(--ink2);word-break:break-word}
.pipe .arrow{text-align:center;color:var(--line2);font-size:15px;line-height:1;
  margin:-4px 0}
.mx{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
.mx th,.mx td{border:1px solid var(--line);padding:4px 8px;text-align:center}
.mx th{background:var(--bg3)}
.mx td.lbl{text-align:left;white-space:nowrap;font-weight:500}
.heat{position:relative}
.heat span{position:relative;z-index:1}
.mech{border:1px solid var(--line);border-radius:8px;background:var(--bg2);
  padding:10px 13px;margin-bottom:8px}
.mech .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.mech .nm{font-weight:600;font-size:13px}
.mech .ex{color:var(--ink2);font-size:12.5px;margin-top:5px;max-width:96ch}
.mech .mt{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;font-size:11px;
  color:var(--ink2);align-items:center}
.chips{display:flex;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px 1px 2px;
  border-radius:12px;border:1px solid var(--line);font-size:11px;
  background:var(--bg3)}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;
  color:var(--ink2);font-size:12px}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:20px 16px 80px}
}
@media print{nav{display:none}.wrap{grid-template-columns:1fr}}
</style>
</head>

f":"stat_modification","s":[],"x":true,"a":[],"e":"White used to do this quite a bit, but we've backed off because it tends to just clog up the board. Green also uses this on occasion."},{"k":"+0/+n (on spells)","l":"+0/+N (on spells)","c":{"W":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":false,"a":[],"e":"Once again, white (and to an even lesser extent green) used to do this more often, but these days we'll boost power some if we're going to boost toughness."},{"k":"+1/+1 counter (creation and caring)","l":"+1/+1 counter (creation and caring)","c":{"W":["primary","both-agree"],"U":["tertiary","both-agree"],"B":["secondary","both-agree"],"R":["tertiary","both-agree"],"G":["primary","both-agree"]},"f":"counters","s":["combat"],"x":false,"a":[],"e":"Any color can put +1/+1 counters on themselves, but white and green are best overall at doing it, including putting them on other creatures."},{"k":"+n/+0 (on auras)","l":"+N/+0 (on Auras)","c":{"W":["secondary","both-agree"],"U":["tertiary","both-agree"],"B":["secondary","both-agree"],"R":["primary","both-agree"],"G":["tertiary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"Red is the color most often to have just power-pumping Auras (including \"firebreathing\" Auras). White and black do it occasionally with white tending to go no higher than +2/+0. Blue and green do it on rare occasion with blue, like white, sticking at +2/+0 or lower."},{"k":"+n/+0 (on creatures)","l":"+N/+0 (on creatures)","c":{"W":["secondary","both-agree"],"R":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"This ability, as a repeatable activation, is what we refer to as \"firebreathing.\" It's most often seen on red creatures. White tends to get one-time upgrades of usually +1/+0. Green gets +N/+0 when it's not intended for it to survive the fight."},{"k":"+n/+0 (on spells)","l":"+N/+0 (on spells)","c":{"W":["secondary","both-agree"],"B":["primary","both-agree"],"R":["primary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"Black and red are the two colors that tend to pump power as a spell without also pumping toughness. White does it occasionally as a combat trick but usually never more than +1/+0."},{"k":"+n/+n (on auras)","l":"+N/+N (on Auras)","c":{"W":["primary","both-agree"],"U":["secondary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"All colors have access to Auras that grant +N/+N. White, blue, black, and red tend to top out at +2/+2. Green is the one color that regularly grants +3/+3 and above on Auras"},{"k":"+n/+n (on creatures)","l":"+N/+N (on creatures)","c":{"B":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"For black this is mostly seen on Shades and usually requires black mana. Green gets unlimited pumping activations but usually only when the activation cost is high enough that multiple activations don't happen until the late game."},{"k":"+n/+n (on creatures, single use)","l":"+N/+N (on creatures, single use)","c":{"G":["primary","both-agree"]},"f":"stat_modification","s":[],"x":false,"a":[],"e":"This is what we refer to as the Rootwalla ability. It's trying to simulate a built-in Giant Growth. It's almost always exclusive to green."},{"k":"+n/+n (on spells)","l":"+N/+N (on spells)","c":{"W":["primary","adjudicated"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"The most common use of this is on Giant Growth–like effects in green, usually +3/+3 but it can vary a little. White's pumping is usually +2/+2 or smaller, but it most often will grant an ability as well. The three exception for white is that it can get larger pumps if counting the number of creatures you have, the number of plains you have, or is restricted to blockers. Black will occasionally get smaller buffs, usually with an ability added. Red gets buffs but usually the power is higher than the toughness. All four colors default in this ability to being on instants as it's a combat trick."},{"k":"+n/-n (on auras)","l":"+N/-N (on Auras)","c":{"B":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"These tend to be flavored as \"push your luck\" cards that can double as creature kill. Black will go up to -3 on the toughness, whereas red tends to stop at -2."},{"k":"+n/-n (on creatures)","l":"+N/-N (on creatures)","c":{"U":["primary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"Blue tends to use this mostly on Elementals and Shapeshifters, flavored as shape-changing. Black and red use this on occasion to play up their reckless side."},{"k":"+n/-n (on spells)","l":"+N/-N (on spells)","c":{"B":["primary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"As this is mostly used as a kill spell, the ability resides mostly in black."},{"k":"-n/+n (on auras)","l":"-N/+N (on Auras)","c":{"W":["primary","colour-list-only"]},"f":"stat_modification","s":[],"x":false,"a":[],"e":""},{"k":"-n/+n (on creatures)","l":"-N/+N (on creatures)","c":{"W":["tertiary","both-agree"],"U":["primary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"This is also used in blue on Elementals and Shapeshifters, often on the same cards with the +N/-N. White, on rare occasion, will have an activation that uses this defensively."},{"k":"-n/+n (on spells)","l":"-N/+N (on spells)","c":{"W":["primary","colour-list-only"]},"f":"stat_modification","s":[],"x":false,"a":[],"e":""},{"k":"-n/-0 (on auras)","l":"-N/-0 (on Auras)","c":{"U":["primary","both-agree"],"B":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"We tend to treat the Auras similarly to how we treat the spells."},{"k":"-n/-0 (on creatures)","l":"-N/-0 (on creatures)","c":{"U":["primary","colour-list-only"]},"f":"stat_modification","s":[],"x":false,"a":[],"e":""},{"k":"-n/-0 (on spells)","l":"-N/-0 (on spells)","c":{"U":["primary","both-agree"],"B":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"In blue, this is shrinking its target. In black it's usually some form of torture."},{"k":"-n/-0 to their team","l":"-N/-0 to their team","c":{"U":["primary","both-agree"]},"f":"stat_modification","s":[],"x":false,"a":["-N/-0 to their team, one-shot"],"e":"Just as blue can \"shrink\" a single creature, so too can it \"shrink\" an entire team."},{"k":"-n/-n (on auras)","l":"-N/-N (on Auras)","c":{"B":["primary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"This is an area only black tends to go, used almost exclusively on the opponent's creatures. This ability will occasionally be paired with a positive ability, making it a card you might play on your own creature."},{"k":"-n/-n (on creatures)","l":"-N/-N (on creatures)","c":{"B":["primary","both-agree"]},"f":"stat_modification","s":[],"x":false,"a":[],"e":"On creatures, this effect is used almost exclusively by creatures on other creatures, and almost exclusively in black."},{"k":"-n/-n (on spells)","l":"-N/-N (on spells)","c":{"W":["tertiary","both-agree"],"U":["tertiary","both-agree"],"B":["primary","both-agree"],"R":["tertiary","both-agree"],"G":["tertiary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"Black is the only color to do -N/-N abilities on spells. Other colors do put -1/-1 counters on creatures, usually in place of spots where they would do damage in sets with -1/-1 counters."},{"k":"animating artifacts","l":"Animating artifacts (Target/all non-creature artifact(s) you control becomes an artifact creature.)","c":{"U":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"characteristic_change","s":[],"x":false,"a":[],"e":"Blue is the color most likely to turn a non-creature artifact into an artifact creature. Green is second most likely to do it."},{"k":"animating enchantments","l":"Animating Enchantments (Target/all non-aura enchantment(s) you control becomes an enchantment creature.)","c":{"W":["primary","both-agree"],"U":["secondary","both-agree"]},"f":"characteristic_change","s":[],"x":false,"a":[],"e":"White is the color that animates other enchantments. Blue has enchantments that under certain conditions can become animated."},{"k":"animating lands","l":"Animating lands (Target land becomes an N/N creature until end of turn.)","c":{"W":["tertiary","both-agree"],"U":["tertiary","both-agree"],"B":["tertiary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"characteristic_change","s":[],"x":true,"a":[],"e":"Green, as the color connected most closely to lands and creatures, is the color most likely to turn lands into creatures—usually still keeping them lands. When we do this, we often grant the land haste to avoid having to worry if it was the one you played this turn (which would have summoning sickness). Red uses this ability a little playing into its one-shot damage cards that come through attacking. All the colors have dipped their toe into this area, but it's infrequent and usually only involves animating their own basic land type and is most often done in cycles."},{"k":"artifact destruction","l":"Artifact destruction","c":{"W":["secondary","both-agree"],"R":["primary","both-agree"],"G":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":[],"e":"Red and green usually have one artifact destruction card in common, although green's is usually also a spell that destroy both artifacts and enchantments. (See enchantment destruction.) White is starting to get more artifact destruction at common and is usually also able to destroy enchantments."},{"k":"banisher priest-like effect","l":"Banisher Priest–like effect (When this card enters the battlefield, exile target creature/permanent until this card leaves play.)","c":{"W":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":["Banisher Priest-like effects (When this card enters the battlefield, exile target creature/permanent until this card leaves play.)"],"e":"This is one of white's most efficient answers, especially in Limited. It is usually used on creatures but sometimes hits other permanents. The effect is always on a permanent, usually a creature or enchantment."},{"k":"basic land counting","l":"Basic land counting (Doing an effect equal to the number of basic lands of a certain type you control.)","c":{"W":["tertiary","both-agree"],"U":["tertiary","both-agree"],"B":["secondary","both-agree"],"R":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"mana","s":[],"x":false,"a":[],"e":"All colors have access to this, but red does it most, followed by black and green."},{"k":"bite","l":"\"Bite\" (Target creature deals damage to equal to its power to another target creature.)","c":{"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"This used to just be a red ability, but we realized that green needed it more, as green's creature removal has to be tied to creatures and red had plenty of other direct-damage spells. So red now does this less often."},{"k":"bring back creatures/permanents that went to the graveyard this turn","l":"Bring back creatures/permanents that went to the graveyard this turn","c":{"W":["primary","both-agree"]},"f":"graveyard","s":[],"x":false,"a":[],"e":"White, the color of mercy, is the color that saves things the turn they are destroyed."},{"k":"can't be attacked (creatures can't attack you.)","l":"Can't be attacked (Creatures can't attack you.)","c":{"W":["primary","both-agree"]},"f":"protection","s":[],"x":false,"a":["Can't be attacked. (Creatures can't attack you.)"],"e":"We don't do this often, but this effect keeps you from either being attacked for a turn or as long as a specific permanent is on the battlefield."},{"k":"can't be blocked","l":"Can't be blocked","c":{"U":["primary","both-agree"]},"f":"evasion","s":[],"x":true,"a":[],"e":"We tried to keyword this ability only to discover that there are so many variations on it that we couldn't. Instead, we changed from \"unblockable\" to \"can't be blocked\" to avoid players thinking it was a keyword. (It matters occasionally.) Blue has creatures with this ability and grants it through spells and Auras."},{"k":"can't be countered","l":"Can't be countered","c":{"U":["secondary","both-agree"],"R":["primary","both-agree"],"G":["primary","both-agree"]},"f":"protection","s":[],"x":true,"a":[],"e":"Red tends to have spells that can't be countered while green tends to have creatures that can't be countered. When blue does \"can't be countered,\" which is less often, it's usually a more control-oriented card."},{"k":"can't block","l":"Can't block","c":{"B":["primary","both-agree"],"R":["primary","both-agree"]},"f":"evasion","s":[],"x":true,"a":[],"e":"For a long time we separated black from red by making black have the \"can't block\" drawback on its creatures and red have the \"must attack\" drawback on its creatures. Time has shown that the \"can't block\" drawback leads to better gameplay, so we've started using it on red as much as black."},{"k":"can't lose the game and opponent can't win","l":"Can't lose the game and opponent can't win","c":{"W":["primary","both-agree"]},"f":"win_condition","s":[],"x":false,"a":["Can't lose the game and opponents can't win."],"e":"This is a defensive ability, and thus shows up in white."},{"k":"can't win the game and opponent can't lose","l":"Can't win the game and opponent can't lose","c":{"B":["primary","both-agree"]},"f":"win_condition","s":[],"x":false,"a":["Can't win the game and opponents can't lose"],"e":"This ability is used as a drawback in black."},{"k":"card draw","l":"Card draw","c":{"W":["tertiary","both-agree"],"U":["primary","both-agree"],"B":["secondary","both-agree"],"R":["tertiary","both-agree"],"G":["secondary","both-agree"]},"f":"card_flow","s":[],"x":true,"a":[],"e":"Blue is best at card drawing. It has the most of it and no restrictions. Black's card drawing must involve paying some other cost, most often life but sometimes sacrificing permanents. Green's card draw is tied to creatures. In the past, we've also connected it to land, but that ended up making green card draw a little too much like blue, so we've pulled back from that. All colors get cantrips (spells that draw you a single card). Blue gets the best cantrip spells, white gets the best cantrip small creatures, and green gets the best cantrip large creatures. While white is still tertiary at card drawing, we have added some new abilities for white to draw cards. The big limitation is that white tends to draw over time rather than all at once, so it has a once-per-turn limit on card drawing (multiplayer does allow white on occasion to draw multiple cards tied to how many opponents a player has). Other than cantrips, red only draws cards with three exceptions: impulsive draw, \"punisher\" effects, and wheeling. (See impulsive draw, \"punisher\" effects, and wheeling.)"},{"k":"card filtering","l":"Card filtering (Look at the top N cards of your library and put N in your hand and put the rest on the bottom of the library in any order.)","c":{"U":["primary","both-agree"],"G":["primary","both-agree"]},"f":"card_flow","s":[],"x":true,"a":[],"e":"Blue is the color of information, so it loves having the ability to choose what exactly it gets to draw. Sometimes card filtering looks similar to looting, where you draw some number of cards and then discard a close number. When green does this, it can usually only get a subset of permanents (usually creatures and/or lands) into its hand."},{"k":"cast spells from opponent's graveyard/exile","l":"Cast spells from opponent's graveyard/exile.","c":{"U":["primary","both-agree"],"B":["primary","both-agree"]},"f":"graveyard","s":["card_flow"],"x":false,"a":[],"e":"The two sneakiest colors are the ones most likely to use the opponent's own resources against them. Sometimes blue and black will make the player discard/mill the cards into exile where they can later cast them."},{"k":"cast spells from your graveyard","l":"Cast spells from your graveyard.","c":{"W":["tertiary","both-agree"],"U":["secondary","both-agree"],"B":["primary","both-agree"],"R":["secondary","both-agree"],"G":["tertiary","both-agree"]},"f":"graveyard","s":["card_flow"],"x":false,"a":[],"e":"Black is the color most likely to cast cards from the graveyard, but it's something blue and red also do on occasion, especially instants and sorceries. I've listed white and green as tertiary because we do flashback with regularity."},{"k":"cast spells out of graveyard","l":"Cast spells out of graveyard.","c":{"U":["secondary","both-agree"],"B":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"graveyard","s":["card_flow"],"x":true,"a":[],"e":"Black is the color most focused on the graveyard. Blue occasionally can cast instants and sorceries out of the graveyard. We've also let red play a little in this area, especially in sets where it can grant flashback to instants and sorceries in the graveyard."},{"k":"changing lands","l":"Changing lands (Target land becomes the basic land of your choice.)","c":{"U":["primary","both-agree"]},"f":"characteristic_change","s":[],"x":false,"a":[],"e":"We don't do a lot of land changing these days, but the ability is still in blue in environments where we might need it. It allows blue a way to get access to other colors in multicolor environments."},{"k":"color changing","l":"Color changing (Target/this creature becomes the color(s) of your choice until end of turn.)","c":{"W":["tertiary","both-agree"],"U":["primary","both-agree"],"B":["tertiary","both-agree"],"G":["secondary","both-agree"]},"f":"characteristic_change","s":[],"x":true,"a":[],"e":"Blue can change any creature's color, including its own. Green has this ability on creatures that can change themselves, usually flavored as a chameleon-like effect. White and black have had the ability on rare occasion to make things their own color. As we've lessened the number of effects that care about color, this ability isn't used much these days."},{"k":"copying permanents, permanently","l":"Copying permanents, permanently","c":{"U":["primary","both-agree"]},"f":"copying","s":[],"x":false,"a":[],"e":"Blue has permanents that will choose a target and then remain that target for the rest of the game (or until the permanent chooses to copy a new target)."},{"k":"copying permanents, temporarily","l":"Copying permanents, temporarily","c":{"U":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"copying","s":[],"x":true,"a":[],"e":"Red has permanents (or spells that create this effect) that can temporarily become another creature, usually until end of turn. Blue's cards in this category are cards that change but don't let the controller explicitly choose what they become. (For instance, one might copy the last creature played.)"},{"k":"counter target activated/triggered ability","l":"Counter target activated/triggered ability","c":{"U":["primary","both-agree"],"G":["tertiary","both-agree"]},"f":"control","s":[],"x":true,"a":[],"e":"For a while this was a green effect, but we've moved it to be more in blue. Green does it on rare occasions, usually to counter artifact activations these days."},{"k":"counterspell","l":"Counterspell","c":{"W":["tertiary","both-agree"],"U":["primary","both-agree"]},"f":"control","s":[],"x":false,"a":[],"e":"Counterspelling is one of the few abilities that's almost universally used in a single color. White dips its toe into the ability with taxing and delay-style counterspells."},{"k":"creature pumping, their team, one-shot :: -n/-n to their team","l":"-N/-N to their team","c":{"B":["primary","both-agree"]},"f":"stat_modification","s":["combat"],"x":false,"a":["-N/-N to their team, one-shot"],"e":"This is a common way for black to kill creatures. Sometimes this effect will affect all creatures and not just your opponents."},{"k":"creature pumping, their team, ongoing :: -n/-n to their team","l":"-N/-N to their team","c":{"B":["primary","both-agree"]},"f":"stat_modification","s":["combat"],"x":false,"a":["-N/-N to their team, ongoing"],"e":"This is a common way for black to kill creatures. Sometimes this effect will affect all creatures and not just your opponents."},{"k":"creature pumping, your team, one-shot :: +n/+0 to your team","l":"+N/+0 to your team","c":{"W":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"stat_modification","s":["combat"],"x":true,"a":["+N/+0 to your team","+N/+0 to your team, one-shot"],"e":"Team pump that only pumps power is most often done in red, usually affecting attacking creatures. White will sometimes pump its team's power without pumping toughness (although it more often pumps both)."},{"k":"creature pumping, your team, one-shot :: +n/+n to your team","l":"+N/+N to your team","c":{"W":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"stat_modification","s":["combat"],"x":true,"a":["+N/+N to your team, one-shot"],"e":"White is the color most likely to pump its team, most often with +1/+1, but it will occasionally go up to +2/+2. Green's team pump starts at +3/+3 and often also adds trample."},{"k":"creature pumping, your team, ongoing :: +n/+0 to your team","l":"+N/+0 to your team","c":{"B":["tertiary","adjudicated"],"R":["primary","both-agree"]},"f":"stat_modification","s":["combat"],"x":true,"a":["+N/+0 to your team, ongoing"],"e":"Team pump that only pumps power is most often done in red, usually affecting attacking creatures. White will sometimes pump its team's power without pumping toughness (although it more often pumps both)."},{"k":"creature pumping, your team, ongoing :: +n/+n to your team","l":"+N/+N to your team","c":{"W":["primary","both-agree"],"U":["tertiary","both-agree"],"B":["tertiary","both-agree"],"R":["tertiary","both-agree"],"G":["secondary","both-agree"]},"f":"stat_modification","s":["combat"],"x":true,"a":["+N/+N to your team, ongoing"],"e":"White is the color most likely to pump its team, most often with +1/+1, but it will occasionally go up to +2/+2. Green's team pump starts at +3/+3 and often also adds trample."},{"k":"creature sacrifice, forced, repeatable","l":"Creature sacrifice, forced, repeatable (All players/opponents must sacrifice a creature each turn.)","c":{"B":["primary","colour-list-only"]},"f":"removal","s":[],"x":false,"a":[],"e":""},{"k":"curiosity","l":"\"Curiosity\" (Whenever this creature deals combat damage to an opponent, draw a card.)","c":{"U":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"card_flow","s":[],"x":true,"a":[],"e":"This ability started as a blue-only ability, but we added it in green because it works with green's creature-tied card drawing."},{"k":"damage prevention","l":"Damage prevention (Prevent the next N damage that would be dealt to target creature/player.)","c":{"W":["primary","both-agree"]},"f":"protection","s":[],"x":false,"a":[],"e":"We don't do a lot of this effect any more, but when we do it's almost always in white."},{"k":"damage redirection","l":"Damage redirection (Prevent the next N damage that would be dealt to target creature/player this turn. If damage is prevented in this way, this card deals that much damage to target creature/player.)","c":{"W":["primary","both-agree"]},"f":"protection","s":[],"x":false,"a":[],"e":"This is another effect we've cut significantly back on that is also squarely in white."},{"k":"daunt","l":"\"Daunt\" (This creature can't be blocked by creatures with power 2 or less.)","c":{"G":["primary","both-agree"]},"f":"stat_modification","s":[],"x":false,"a":[],"e":"This is an ability we've been trying out in small doses in green. I don't know if it will ever make it to evergreen status, but it's a possibility."},{"k":"deal damage when blocked","l":"Deal damage when blocked","c":{"U":["tertiary","both-agree"],"B":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"combat","s":[],"x":true,"a":[],"e":"This is an effect that goes on creatures. It is done primarily in red. When black does it, it is usually loss of life. I list blue because the afflict mechanic (from Hour of Devastation) that does this is also in blue (as Bolas's Eternal Zombie army was in Bolas's colors: blue, black, and red)."},{"k":"deal n damage to a creature that's been damaged this turn","l":"Deal N damage to a creature that's been damaged this turn.","c":{"B":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"Black and red are the colors that prey on the weak."},{"k":"deal n damage to a creature with flying","l":"Deal N damage to a creature with flying.","c":{"R":["tertiary","adjudicated"],"G":["primary","both-agree"]},"f":"evasion","s":["combat"],"x":false,"a":[],"e":"As the two anti-flying colors, red and green will deal damage to fliers. Green does it significantly more than red, as any of red's direct damage to creatures can hit fliers."},{"k":"deal n damage to a creature/planeswalker/player where n is the number of cards in your hand/your opponent's hand","l":"Deal N damage to a creature/planeswalker/player where N is the number of cards in your hand/your opponent's hand.","c":{"R":["primary","both-agree"]},"f":"combat","s":[],"x":true,"a":["Deal N damage to a creature/player where N is the number of cards in your hand/your opponent's hand."],"e":"We tend to do this in sets when red has a more spell-based theme."},{"k":"deal n damage to creature, planeswalker, and/or player","l":"Deal N damage to creature, planeswalker, and/or player.","c":{"W":["secondary","both-agree"],"B":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"Red is king of direct damage and has it in many forms, including the most straightforward versions. White can do damage where N is the number of creatures you control. Black will do direct damage to creatures, planeswalkers, or players and then gain life. (See drain life.) Black will sometimes deal damage to players as a punishment."},{"k":"deal n damage to target attacking or blocking creature","l":"Deal N damage to target attacking or blocking creature.","c":{"W":["primary","both-agree"]},"f":"combat","s":[],"x":true,"a":[],"e":"Other than basing damage on number of creatures, white's direct damage only shows up in combat."},{"k":"deathtouch","l":"Deathtouch","c":{"B":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"This ability was primary in both black and green for a while, but we found that black both had more need for it and had more flavorful ways to express it creatively."},{"k":"defender","l":"Defender","c":{"W":["primary","both-agree"],"U":["primary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["secondary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"Basically everyone can have defender, but it leans toward white and blue philosophically as those are the most defensive colors."},{"k":"destroy all creatures","l":"Destroy all creatures.","c":{"W":["primary","both-agree"],"B":["secondary","both-agree"]},"f":"removal","s":[],"x":false,"a":[],"e":"White is the color that most often does mass creature kill, with it showing up on a rare or mythic rare in almost every set. Black mass-creature kill is not quite as frequent. Red has a similar effect where it does large amount of damage to all creatures (see direct damage)."},{"k":"destroy all creatures controlled by one player","l":"Destroy all creatures controlled by one player.","c":{"B":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":[],"e":"White believes in balance and parity, so only black will kill just one player's creatures."},{"k":"destroy all creatures with power 3 or greater","l":"Destroy all creatures with power 3 or greater.","c":{"W":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":["Destroy all creatures with power 3/4 or greater."],"e":"Killing big creatures is a white thing, so it can be combined with mass creature kill. The number is most often 3 power, but occasionally can be tweaked up. White will occasionally also do mass destruction based on other criteria, but it tends to destroy all creatures of that quality."},{"k":"destroy target attacking or blocking creature","l":"Destroy target attacking or blocking creature.","c":{"W":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":[],"e":"White tends to do its creature destruction in one of four ways: white can kill during combat, it sometimes will just hit attackers or just hit blockers, or white will often exile creatures instead of destroying then."},{"k":"destroy target creature","l":"Destroy target creature.","c":{"W":["secondary","ability-catalog-only"],"B":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":[],"e":"Black is king of creature destruction and is the one color that can kill regardless of circumstance. White can kill a single creature, but usually at a higher cost. Sometimes in both white and black this spell exiles the creature instead of destroying it."},{"k":"destroy target creature that damaged you or a creature you control this turn","l":"Destroy target creature that damaged you or a creature you control this turn.","c":{"W":["primary","both-agree"]},"f":"removal","s":[],"x":false,"a":[],"e":"White is also willing to destroy something after it has hurt white in some way."},{"k":"destroy target creature with flying","l":"Destroy target creature with flying.","c":{"G":["primary","both-agree"]},"f":"removal","s":["combat"],"x":true,"a":[],"e":"Green is allowed to kill only two types of creatures—flying creatures (as it is the anti-flying color) and artifact creatures (see artifact destruction)."},{"k":"destroy target creature with power 3 or greater","l":"Destroy target creature with power 3 or greater.","c":{"W":["primary","both-agree"]},"f":"removal","s":[],"x":false,"a":["Destroy target creature with power 3/4 or greater."],"e":"As champion of the little guy, white will also destroy large creatures. We've moved the floor of the ability from power 4 to power 3."},{"k":"destroy target creature. its controller gets compensation","l":"Destroy target creature. Its controller gets compensation.","c":{"W":["primary","both-agree"]},"f":"removal","s":[],"x":false,"a":[],"e":"This ability used to be in white and blue (flavored as transformation in blue), but it's now just a white ability."},{"k":"destroy target tapped creature","l":"Destroy target tapped creature.","c":{"W":["primary","both-agree"],"B":["secondary","both-agree"]},"f":"removal","s":[],"x":false,"a":[],"e":"White can also destroyed tapped creatures using a similar flavor to destroying creatures that have harmed it."},{"k":"devil's deal permanents","l":"\"Devil's Deal\" permanents (Cards that grant you power but at a cost)","c":{"B":["primary","both-agree"]},"f":"sacrifice","s":[],"x":true,"a":[],"e":"Black is the color of \"power at any cost,\" so it gets permanents (usually) that start helping you but have the potential to hurt you in the end. These are most often creatures or enchantments, but occasionally show up in other forms."},{"k":"direct damage, multiple targets","l":"Direct damage, multiple targets","c":{"W":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"combat","s":[],"x":true,"a":[],"e":"Red will deal damage to all or a subset of creatures, sometimes dealing a small amount (1 or 2 damage, killing small creatures), sometimes doing larger amounts that kill most creatures. Red's damage in this area most often hits all creatures, including its own. White will occasionally deal damage to multiple creature if they all are attackers and/or blockers."},{"k":"discard as a cost","l":"Discard as a cost","c":{"W":["tertiary","both-agree"],"U":["tertiary","both-agree"],"B":["primary","both-agree"],"R":["secondary","both-agree"],"G":["tertiary","both-agree"]},"f":"sacrifice","s":["disruption"],"x":false,"a":[],"e":"While all colors have access to discarding cards as a cost, black does it most and red does it second most."},{"k":"discard as effect","l":"Discard as effect","c":{"B":["primary","both-agree"]},"f":"disruption","s":[],"x":true,"a":[],"e":"This is one of only a handful of major abilities to be contained to just one color. The closest a second color comes is blue, which occasionally gets targeted card filtering that can be used on the opponent."},{"k":"double strike","l":"Double strike","c":{"W":["primary","both-agree"],"R":["primary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"White and red are also the primary colors for first strike. Black, which is tertiary in first strike, does not get double strike."},{"k":"drain life","l":"\"Drain life\" (Deal damage to a creature/player and gain life equal to that damage.)","c":{"W":["tertiary","both-agree"],"B":["primary","both-agree"]},"f":"life","s":["combat"],"x":true,"a":[],"e":"Other colors will deal damage or gain life, but black is the color that does both at the same time. (Okay, technically, red and white together can do this too.) Black also will do triggered or activated effects that repeatedly drain the player, usually for 1. White has dipped its toe into this area in Orzhov sets (aka Ravnica sets)."},{"k":"enchantment destruction","l":"Enchantment destruction","c":{"W":["primary","both-agree"],"B":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":[],"e":"White and green usually have one enchantment destruction card in common; green's usually also destroys artifacts, and sometimes white does as well. (See artifact destruction.) We've also started to let black have enchantment removal. It's clearly at a power level lower than white or green and often forces the opponent to sacrifice the enchantment or makes you pay an extra cost."},{"k":"enchantress ability","l":"\"Enchantress\" ability (Whenever you play an enchantment, draw a card.)","c":{"W":["primary","both-agree"],"G":["primary","both-agree"]},"f":"card_flow","s":[],"x":true,"a":[],"e":"This ability started in Limited Edition (Alpha) on Verduran Enchantress, a green card. It has bounced back and forth between green and white, and now can be done by either. In white, it has the limitation of only drawing one card per turn as that's a new rule for white card drawing. The best ones are probably going to appear in white and green."},{"k":"exiling cards from graveyard","l":"Exiling cards from graveyard","c":{"W":["secondary","adjudicated"],"B":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"graveyard","s":[],"x":true,"a":[],"e":"This effect is used to get rid of cards in a graveyard that might have an effect/usable activation cost. Black does it most often, but white and green occasionally do it in sets that need it."},{"k":"extra attack","l":"Extra attack (Untap all creatures that attacked this turn. After this main phase, there is an additional combat phase followed by an additional main phase.)","c":{"W":["tertiary","both-agree"],"R":["primary","both-agree"]},"f":"tempo","s":[],"x":true,"a":[],"e":"Attacking twice has always been red's domain. Thematically, it makes sense that white might occasionally do this."},{"k":"fight","l":"Fight","c":{"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"combat","s":[],"x":true,"a":[],"e":"This is green's primary form of creature destruction. Red uses it occasionally but at a much lower volume."},{"k":"first strike","l":"First strike","c":{"W":["primary","both-agree"],"B":["tertiary","both-agree"],"R":["primary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"White and red are the two cards with trained fighters (white has the army and red the creatures that have gotten good through constant impulsive fighting). Black is tertiary, and uses this these days almost exclusively on Knights."},{"k":"flash","l":"Flash","c":{"W":["secondary","both-agree"],"U":["primary","both-agree"],"B":["secondary","adjudicated"],"R":["tertiary","ability-catalog-only"],"G":["secondary","both-agree"]},"f":"tempo","s":[],"x":true,"a":[],"e":"Everyone gets some access to flash. Blue gets it the most as it plays into the color's reactive play style. In the last few years, we made it secondary in white and black, and kept it secondary in green. White tends to get the small cheap and mid-size defensive creatures, black gets creatures that can surprise kill you, often with higher power than toughness, and green gets bigger creatures. Red can get flash when it functionally needs it to get an effect to work, most often with reactive enters-the-battlefield effects."},{"k":"flicker","l":"\"Flicker\" (Exile target creature/permanent, then return it to the battlefield under its owner's control—occasionally the creature/permanent returns at the end of the turn.)","c":{"W":["primary","both-agree"],"U":["primary","both-agree"]},"f":"tempo","s":["protection"],"x":false,"a":[],"e":"This ability appears in both white and blue, although we've recently been trying to push it a little more in white."},{"k":"flying","l":"Flying","c":{"W":["primary","both-agree"],"U":["primary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["tertiary","both-agree"]},"f":"evasion","s":["combat"],"x":true,"a":[],"e":"White and blue are the two main colors with flying. Blue gets the most fliers. White gets the most efficient small fliers. Blue more often grants flying, although white does it on occasion. Red's flying is mostly restricted to Dragons and Phoenixes with the occasional weak small fliers. Green's tertiary is almost a quaternary, in that it gets flying very infrequently."},{"k":"fog","l":"\"Fog\" (Prevent all combat damage that would be dealt this turn.)","c":{"W":["tertiary","both-agree"],"G":["primary","both-agree"]},"f":"protection","s":[],"x":false,"a":[],"e":"This effect has shown up in four of the five colors over the years. It started in green, spent numerous years bouncing around, ended up in white, and then finally got moved back to green where it has stayed."},{"k":"forced attack","l":"Forced attack (Target creature attacks this turn if able.)","c":{"U":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"evasion","s":[],"x":false,"a":[],"e":"We don't use this ability a lot, but when we do, we use it in red and blue. Red is flavored as emotional tampering and blue as mind control."},{"k":"forced block (target creature must block this turn.)","l":"Forced block (Target creature must block this turn.)","c":{"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"evasion","s":[],"x":false,"a":[],"e":"We don't do this effect often, but green does it most, then red."},{"k":"forced sacrifice :: sacrifice a creature","l":"Sacrifice a creature. (Target/all player(s) sacrifice a creature.)","c":{"B":["primary","ability-catalog-only"]},"f":"removal","s":[],"x":false,"a":[],"e":"Sometimes black kills your creatures and sometimes it makes you do it."},{"k":"forced sacrifice :: sacrifice an artifact","l":"Sacrifice an artifact. (Target/all player(s) sacrifice an artifact.)","c":{"R":["primary","ability-catalog-only"]},"f":"removal","s":[],"x":false,"a":[],"e":"Red can force you to sacrifice artifacts."},{"k":"forced sacrifice of a creature","l":"Forced sacrifice of a creature","c":{"B":["primary","colour-list-only"]},"f":"removal","s":[],"x":false,"a":[],"e":""},{"k":"freeze creature","l":"\"Freeze\" creature (Tap target creature. That creature doesn't untap during its controller's next untap step.)","c":{"U":["primary","both-agree"]},"f":"tempo","s":[],"x":false,"a":[],"e":"This is a blue ability that R&D has grown fond of in recent years."},{"k":"friendly to artifacts","l":"Friendly to artifacts","c":{"W":["primary","both-agree"],"U":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"card_type_affinity","s":[],"x":true,"a":[],"e":"White and blue, as the colors of civilization, are both very friendly with artifacts. Red tends to be associated with Equipment and Vehicles (along with white) or using artifacts as a resource (interacting with things like treasure artifact tokens)."},{"k":"friendly to creatures","l":"Friendly to creatures","c":{"W":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"Green and white are the main creature colors (they have the highest percentage of creatures versus spells) so they most often like you having creatures."},{"k":"friendly to enchantments","l":"Friendly to enchantments","c":{"W":["primary","both-agree"],"B":["tertiary","both-agree"],"G":["primary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"White and green are also the two colors that most appreciate enchantments. Black sometimes cares in sets with an enchantment theme or subtheme."},{"k":"friendly to instants and sorceries","l":"Friendly to instants and sorceries","c":{"U":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"The creature colors like creatures, the spell colors like instants and sorceries."},{"k":"friendly to lands","l":"Friendly to lands","c":{"W":["secondary","both-agree"],"U":["secondary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"Green is the color that loves lands the most, but every color loves its own basic land type."},{"k":"friendly to legendary permanents","l":"Friendly to legendary permanents","c":{"W":["primary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"White is the color that most interacts with legendary permanents. It can search the library for them and get them back from the graveyard, among other positive interactions."},{"k":"friendly to low mana value cards","l":"Friendly to low mana value cards","c":{"W":["primary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"White is the color that most positively interacts with low mana value (anywhere from mana value 3 or less) cards. It can search the library for them and get them back from the graveyard, among other positive interactions."},{"k":"friendly to planeswalkers","l":"Friendly to planeswalkers","c":{"W":["primary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"White is the color that most interacts with planeswalkers. It can search the library for them and get them back from the graveyard, among other positive interactions."},{"k":"gain control of target player's turn","l":"Gain control of target player's turn","c":{"B":["primary","both-agree"]},"f":"theft","s":[],"x":false,"a":[],"e":"This effect is actually most often done in colorless, but black is the color that can do it in the color pie."},{"k":"gaseous form","l":"\"Gaseous Form\" (This creature neither deals nor receives damage.)","c":{"W":["primary","both-agree"],"U":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"We don't do this effect much any more, but years back we moved it from blue to white (and in the very early days it showed up in green as a Fog variant). White will grant the ability to creatures, whereas blue tends to have the ability on creatures."},{"k":"haste","l":"Haste","c":{"B":["secondary","both-agree"],"R":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"Haste shows up most often on red creatures. We've moved green into second place for haste. Black is still technically secondary, but gets haste less often than green."},{"k":"hexproof","l":"Hexproof","c":{"W":["tertiary","both-agree"],"U":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"protection","s":[],"x":true,"a":[],"e":"Blue both has more creatures with hexproof and more often grants it as a pseudo-counterspell. Green tends to get hexproof on larger creatures without evasion. White gets hexproof infrequently, sometimes on players, in ways that feel like it's protecting the thing."},{"k":"illusion ability","l":"\"Illusion ability\" (Sacrifice this creature if it is the target of a spell or ability.)","c":{"U":["primary","both-agree"]},"f":"protection","s":[],"x":false,"a":[],"e":"This ability started in black on Spirits and was known as \"skulking,\" but has since been moved into blue and attached to Illusions. The ability used to care about spells and abilities, but now just cares about spells."},{"k":"impulsive draw","l":"\"Impulsive draw\" (Exile the top N cards of your library. Until end of turn, you may play cards exiled this way.)","c":{"R":["primary","both-agree"]},"f":"card_flow","s":[],"x":false,"a":[],"e":"This is red's primary way of card drawing, playing into red's impulsive nature of wanting to do things now. Sometimes we let you cast the spell until the end of your next turn."},{"k":"increasing counters and/or tokens","l":"Increasing counters and/or tokens","c":{"W":["secondary","both-agree"],"U":["primary","both-agree"],"G":["primary","both-agree"]},"f":"counters","s":[],"x":false,"a":[],"e":"This effect either makes more counters or tokens as they're being made or makes more after they've already been made. Sometimes this is one for one, sometimes it just adds one or two more. Blue and green do it most often, but we've started letting white in on the fun."},{"k":"indestructible","l":"Indestructible","c":{"W":["primary","both-agree"],"U":["tertiary","both-agree"],"B":["secondary","both-agree"],"R":["tertiary","both-agree"],"G":["secondary","both-agree"]},"f":"protection","s":[],"x":true,"a":[],"e":"White, and to a lesser extent green, tend to have creature that naturally have indestructible. Black and green, as the replacement for regeneration, often have activated abilities that grant indestructible until end of turn. White will at times use temporary indestructibility where it used to use protection. We allow all colors access to it when we do things like cycles of Gods."},{"k":"instant and/or sorcery triggers","l":"Instant and/or sorcery triggers (Whenever you cast an instant and/or sorcery . . . )","c":{"U":["primary","both-agree"],"R":["primary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"Blue and red are the two colors with the highest percentage of spells (as opposed to creatures), so they are the two colors that most often care about them being cast."},{"k":"land destruction","l":"Land destruction","c":{"B":["tertiary","both-agree"],"R":["primary","both-agree"],"G":["tertiary","both-agree"]},"f":"removal","s":["disruption"],"x":true,"a":[],"e":"Red is the one color that regularly does land destruction. Black and green are still able to do it, but do it very infrequently. Most land destruction in green these days (and \"these days\" hasn't been in a while) is \"destroy target noncreature permanent.\""},{"k":"lhurgoyf","l":"\"Lhurgoyf\" (This creature's power and toughness are equal to the number of cards in your/all graveyards.)","c":{"W":["tertiary","both-agree"],"U":["tertiary","both-agree"],"B":["secondary","both-agree"],"R":["tertiary","both-agree"],"G":["primary","both-agree"]},"f":"graveyard","s":[],"x":true,"a":[],"e":"Lhurgoyfs started as a green thing and have since gone on to also be a black thing. On rare occasion, we'll have other colors play in this space, either in a cycle or by caring about some different quality of card in the graveyard. Another change is that sometimes we'll care about the number when casting and lock it down with +1/+1 counters rather than it being a stat you have to keep checking on."},{"k":"life gain","l":"Life gain","c":{"W":["primary","both-agree"],"B":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"life","s":[],"x":true,"a":[],"e":"White and green are the two colors that will have effects that simply gain a player life. Black can gain life but only when either sacrificing something, using lifelink, or damaging another creature or player. (See drain life.) White will sometimes gain life when other creatures enter the battlefield and black will sometimes gain life when other creatures die."},{"k":"life loss as a cost","l":"Life loss as a cost","c":{"W":["tertiary","both-agree"],"U":["tertiary","both-agree"],"B":["primary","both-agree"],"R":["tertiary","both-agree"],"G":["tertiary","both-agree"]},"f":"life","s":[],"x":true,"a":[],"e":"Black is the color that most often uses life as a cost. All colors have access to it on rare occasions where the world calls for it (like New Phyrexia)."},{"k":"life loss as an effect","l":"Life loss as an effect","c":{"B":["primary","both-agree"]},"f":"life","s":[],"x":false,"a":[],"e":"Black will sometimes just make players lose life straight up without a drain effect."},{"k":"lifelink","l":"Lifelink","c":{"W":["primary","both-agree"],"B":["primary","both-agree"]},"f":"life","s":["combat"],"x":false,"a":[],"e":"White and black have very different flavor rationales for the abilities, but both use it almost every set."},{"k":"lobotomy","l":"\"Lobotomy\" (Choose a non-land card name. Search target player's graveyard hand and library for all cards with that name and exile them.)","c":{"B":["primary","both-agree"]},"f":"control","s":[],"x":false,"a":[],"e":"This ability started on a blue-black card in Tempest called [autocard mvid=\"23170\"]Lobotomy, but has since drifted to be just a black thing."},{"k":"lockdown (enchanted creature doesn't untap.)","l":"\"Lockdown\" (Enchanted creature doesn't untap.)","c":{"U":["primary","both-agree"]},"f":"tempo","s":[],"x":false,"a":[],"e":"This is one of blue's primary creature answers in Limited. It's used almost solely on Auras. See freeze for a temporary version, also in blue."},{"k":"looking at opponent's hand","l":"Looking at opponent's hand","c":{"U":["primary","both-agree"],"B":["secondary","both-agree"]},"f":"disruption","s":[],"x":true,"a":[],"e":"Blue is the color that can simply do this effect. Black does it only in conjunction with discarding where it has to choose what gets discarded. We've been scaling back on this effect, as it tends to slow down gameplay. This has had the interesting effect of making the ability appear more in black than blue, as we still make the discard spells."},{"k":"looting (draw a card and discard a card.)","l":"\"Looting\" (Draw a card and discard a card.)","c":{"U":["primary","both-agree"]},"f":"card_flow","s":[],"x":false,"a":[],"e":"Blue is the color that likes to go searching for answers by digging through its library."},{"k":"lure","l":"\"Lure\" (All creatures able to block this creature must do so.)","c":{"G":["primary","both-agree"]},"f":"evasion","s":[],"x":true,"a":[],"e":"This ability has been with Magic since Limited Edition (Alpha), but we've started scaling back how often we do it. It's done infrequently now, and only at higher rarities because of its impact on Limited."},{"k":"lure, limited","l":"\"Lure,\" limited (This creature must be blocked this turn if able.)","c":{"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"evasion","s":[],"x":true,"a":[],"e":"This is the watered-down version of Lure. Somebody must block your creature, but everyone doesn't have to. We started occasionally using the ability in red."},{"k":"mana production, permanent","l":"Mana production, permanent","c":{"U":["secondary","both-agree"],"B":["tertiary","both-agree"],"G":["primary","both-agree"]},"f":"mana","s":[],"x":true,"a":[],"e":"Besides being the land-fetching color, green is also the color with permanents that can produce mana turn after turn to help it ramp up quickly and cast large spells. Black does this infrequently, usually with some payment required. Blue has access to permanents that produce colorless man, sometimes flavored to helping cast artifacts."},{"k":"mana production, temporary","l":"Mana production, temporary","c":{"B":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"mana","s":[],"x":true,"a":[],"e":"Red is the color best at producing temporary bursts of mana, be it with one-shot spells, permanents with one-time triggers, or things that need to be sacrificed to be used. Black can also get mana but usually requires paying some cost, most often sacrificing something else."},{"k":"manipulate time (end the turn.)","l":"\"Manipulate time\" (End the turn.)","c":{"U":["primary","both-agree"],"R":["tertiary","both-agree"]},"f":"tempo","s":[],"x":false,"a":[],"e":"We don't do this ability very often, but when we do it's put in blue and flavored as time manipulation. Red has done it once with a \"lose at end of next turn\" rider."},{"k":"maro ability","l":"\"Maro\" ability (This creature's power and toughness are equal to the number of cards in our hand.)","c":{"U":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"card_flow","s":[],"x":false,"a":[],"e":"Blue is the color of knowledge and green is the color of wisdom, so those are the two colors that like to care about what you \"know.\""},{"k":"meddling","l":"\"Meddling\" (Name a spell. That spell can't be played as long as this card is on the battlefield.)","c":{"W":["primary","both-agree"]},"f":"rules_alteration","s":[],"x":true,"a":[],"e":"This ability, named after Meddling Mage from Invasion (Chris Pikula's Invitational card), is usually on a creature or enchantment and stops a specific spell from being cast. As this is proactive, it's in white."},{"k":"menace","l":"Menace","c":{"B":["primary","both-agree"],"R":["primary","both-agree"]},"f":"evasion","s":["combat"],"x":false,"a":[],"e":"This ability started in red when it was an unnamed thing, but was added to black when it became keyworded because intimidate had gone away and black needed some kind of evasion other than flying. There's been some talk that a third color should be secondary or tertiary."},{"k":"milling","l":"Milling (You/target player puts the top N cards from his or her library into his or her graveyard.)","c":{"U":["primary","both-agree"],"B":["secondary","both-agree"]},"f":"disruption","s":["graveyard"],"x":true,"a":[],"e":"For many years this ability was only in blue, but a number of years ago we started allowing black to do it as well. Both colors also get self-mill as an effect and a cost."},{"k":"moving enchantments/counters","l":"Moving enchantments/counters","c":{"U":["primary","both-agree"]},"f":"counters","s":[],"x":false,"a":[],"e":"Blue is the color of moving attached things. It hasn't moved Equipment yet, but perhaps one day."},{"k":"must attack","l":"Must attack","c":{"R":["primary","both-agree"]},"f":"evasion","s":[],"x":false,"a":[],"e":"The flavor of this is great in red, but we've found the gameplay is not always great. So we've been doing less of this in red overall."},{"k":"pacifism-like effect","l":"Pacifism-like effect (Enchanted creature cannot attack or block.)","c":{"W":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":[],"e":"This is one of white's strongest forms of creature removal for Limited, usually in the form of an Aura. It infrequently is used on noncreatures. Sometimes the spell also prevents that creature/permanent from using activations. It also sometimes only stops just attacking or just blocking."},{"k":"panic","l":"\"Panic\" (Target creature can't block this turn.)","c":{"R":["primary","both-agree"]},"f":"evasion","s":[],"x":true,"a":[],"e":"This ability mostly shows up on spells but occasionally as an activated ability at higher rarities."},{"k":"planeswalker destruction","l":"Planeswalker destruction","c":{"B":["primary","both-agree"],"G":["tertiary","both-agree"]},"f":"removal","s":[],"x":false,"a":[],"e":"Black is the color that regularly destroys planeswalkers, often using \"destroy creature or planeswalker.\" Green doesn't call out planeswalker by name (Nissa's Defeat being an exception), but can \"destroy target noncreature.\" Green is now tertiary in this as we don't use this ability much any more in green. Red is not listed here because it uses damage to deal with planeswalkers rather than destroy them outright."},{"k":"play extra lands/put a land from hand onto the battlefield","l":"Play extra lands/Put a land from hand onto the battlefield","c":{"G":["primary","both-agree"]},"f":"mana","s":[],"x":false,"a":[],"e":"We don't do either of these effects often, but they are both in green's slice of the color pie."},{"k":"playing cards off the top of library, for free","l":"Playing cards off the top of library, for free","c":{"R":["primary","both-agree"]},"f":"card_flow","s":[],"x":false,"a":[],"e":"This ability used to be in blue, but we moved it to red as it has a chaotic feel (you don't know what's about to happen) and red needed more stuff."},{"k":"playing cards off the top of opponent's library","l":"Playing cards off the top of opponent's library","c":{"U":["primary","both-agree"],"B":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"card_flow","s":[],"x":true,"a":[],"e":"Blue and black, being the sneaky colors, are the two that most often cast spells off the opponent's deck. We occasionally let red do it, but usually there's a short duration during which you can do it, unlike blue and black that usually doesn't have a time limit."},{"k":"playing cards off the top of your library, paying their mana cost","l":"Playing cards off the top of your library, paying their mana cost (You may look at the top card of your library and if it's a [blah] you may play it.)","c":{"W":["secondary","both-agree"],"U":["secondary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["secondary","both-agree"]},"f":"card_flow","s":[],"x":true,"a":[],"e":"We don't do this effect very often, so I made it primary in no color. Any color can have access to it, but it must play cards from a subset that make sense for that color. Blue is the color we've let cast any card off the top."},{"k":"polymorph","l":"\"Polymorph\" (Exile target creature. Its controller reveals cards from the top of his or her library until he or she reveals a creature card. That player puts that card onto the battlefield.)","c":{"U":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"removal","s":["card_flow"],"x":true,"a":[],"e":"For a long time, this ability was a blue thing. When we were looking for more places to expand red, we decided to slice up the polymorph pie. Blue gets transformations where the outcome is known and red gets them where it is not. The idea being that blue only wants to transform something when they know what they're going to get, whereas red is willing to take a risk. Red will also do large chaotic effects where many things change all at once."},{"k":"preventing actions","l":"Preventing actions (Your opponents can't cast spells this turn.)","c":{"W":["primary","both-agree"]},"f":"rules_alteration","s":[],"x":false,"a":[],"e":"White is the proactive color, stopping things from before they happen (as opposed to blue being reactive, stopping things as they happen)."},{"k":"protection","l":"Protection","c":{"W":["primary","both-agree"],"U":["tertiary","both-agree"],"B":["tertiary","both-agree"],"R":["tertiary","both-agree"],"G":["tertiary","both-agree"]},"f":"protection","s":[],"x":true,"a":[],"e":"Protection has changed back from deciduous status back to evergreen status, but it doesn't show up in every set. It's mostly a white ability that can show up in other colors, usually with protection from something the color dislikes (an enemy color, artifacts for green, etc.)."},{"k":"prowess","l":"Prowess","c":{"W":["tertiary","both-agree"],"U":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"card_type_affinity","s":[],"x":false,"a":[],"e":"This ability started out as a Jeskai keyword in Khans of Tarkir. It filled a gap we had in blue and red, so that's where we focused it. White has not yet gotten a prowess card outside of Khans of Tarkir block, but I believe it eventually will. For a while this ability was evergreen, but it's since become deciduous (and even then, barely). I don't list most of the deciduous abilities in this article, but as this used to be evergreen, I left it in."},{"k":"punisher effects","l":"\"Punisher\" effects (Opponent chooses one: thing X happens or thing Y happens.)​","c":{"B":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"disruption","s":[],"x":true,"a":[],"e":"In red, one of the two abilities is usually damage to the opponent making the choice; the other option is often something red doesn't normally do in the color pie. Black does this a little, but doesn't tend to have the color pie–bending aspect."},{"k":"putting artifacts from hand onto the battlefield","l":"Putting artifacts from hand onto the battlefield","c":{"W":["secondary","both-agree"],"U":["primary","both-agree"]},"f":"cheat_into_play","s":[],"x":false,"a":[],"e":"Blue does this as the \"friendly to artifacts\" color. White will do it when it involves Equipment."},{"k":"putting creatures from hand onto the battlefield","l":"Putting creatures from hand onto the battlefield","c":{"W":["tertiary","both-agree"],"U":["secondary","both-agree"],"B":["tertiary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"cheat_into_play","s":[],"x":true,"a":[],"e":"Green does this effect the most often. Blue will do it usually flavored as transformation, and will return one its creatures to its owner's hand. When red does this the creature is most often sacrificed or returned to hand at end of turn. We let all colors dip their toes in this area when messing with creature types of their color."},{"k":"putting enchantments from hand onto the battlefield","l":"Putting enchantments from hand onto the battlefield","c":{"W":["primary","both-agree"],"U":["tertiary","both-agree"],"G":["secondary","both-agree"]},"f":"cheat_into_play","s":[],"x":true,"a":[],"e":"This is another effect we don't do that often. White and, interestingly, blue tend to do this tied to Auras, while green will put out any enchantment."},{"k":"putting lands from hand onto the battlefield","l":"Putting lands from hand onto the battlefield","c":{"G":["primary","both-agree"]},"f":"mana","s":[],"x":false,"a":[],"e":"Green used to do this all the time. It still does it, but not as often as it used to."},{"k":"putting planeswalkers from hand onto the battlefield","l":"Putting planeswalkers from hand onto the battlefield","c":{"W":["primary","both-agree"]},"f":"cheat_into_play","s":[],"x":false,"a":[],"e":"We haven't actually done this effect yet. My best guess is it would be in white."},{"k":"random destruction effects","l":"Random destruction effects (Destruction where the outcome is unknown at the time of casting.)","c":{"R":["primary","both-agree"]},"f":"removal","s":[],"x":true,"a":[],"e":"Red is the color of chaos, so we occasionally give it effects that destroy random nonenchantment permanents (sometimes a subset)."},{"k":"reach","l":"Reach","c":{"W":["tertiary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"evasion","s":["combat"],"x":true,"a":[],"e":"As green mostly has no flying, this is one of the tools green has to deal with other players' flying creatures. We've very recently decided to make it secondary in red. White's tertiary status comes mostly on archers."},{"k":"reanimate permanent","l":"\"Reanimate\" permanent (Return a permanent card from a graveyard to the battlefield.)","c":{"W":["primary","both-agree"]},"f":"graveyard","s":[],"x":false,"a":[],"e":"White is the one color that can reanimate any permanent type, so it gets to reanimate \"target permanent.\" It can also reanimate \"target artifact,\" \"target enchantment,\" or \"target planeswalker.\" It doesn't specifically get \"target land,\" but can do so when it's \"target permanent.\""},{"k":"reanimation","l":"\"Reanimation\" (Return a creature card from a graveyard to the battlefield.)","c":{"W":["primary","both-agree"],"B":["primary","both-agree"],"R":["secondary","both-agree"],"G":["secondary","both-agree"]},"f":"graveyard","s":[],"x":true,"a":[],"e":"Black is the best at bringing the dead back to life. It has no real restrictions on what it can bring back. White tends to reanimate smaller creatures, usually with a converted mana cost of 2 or less, but we've started letting white bring back larger creatures on occasion. Red has Phoenixes. Green has creatures that can bring themselves back from the graveyard. Both black and white will sometimes reanimate a swath of creatures all at once."},{"k":"removing counters","l":"Removing counters","c":{"B":["primary","both-agree"]},"f":"counters","s":[],"x":true,"a":[],"e":"Black is the color that gets rid of counters, but only from permanents on the battlefield and not players."},{"k":"restocking","l":"\"Restocking\" (Putting cards from graveyard back into your library)","c":{"U":["primary","both-agree"],"G":["primary","both-agree"]},"f":"graveyard","s":[],"x":false,"a":[],"e":"This is a means of getting cards in your graveyard back into your library. Green does it as a \"cycle of life\" flavor, while blue is flavored more as magical manipulation. Blue sometimes also shuffling your hand in as well and then draws you cards."},{"k":"return target artifact from graveyard to hand","l":"Return target artifact from graveyard to hand.","c":{"W":["primary","both-agree"]},"f":"graveyard","s":[],"x":false,"a":[],"e":"Blue used to be the color that returned artifacts from the graveyard to the hand, but the ability is now in white."},{"k":"return target card from graveyard to hand","l":"Return target card from graveyard to hand.","c":{"G":["primary","both-agree"]},"f":"graveyard","s":[],"x":true,"a":[],"e":"The ability to get back any card is mostly done in green and usually appears at uncommon or higher in rarity."},{"k":"return target creature from graveyard to hand","l":"Return target creature from graveyard to hand.","c":{"W":["secondary","both-agree"],"B":["primary","both-agree"]},"f":"graveyard","s":[],"x":true,"a":[],"e":"Black can return any creature, but only from your graveyard. (We don't allow you to put other player's cards in your hand.) Black will often do this as an enters-the-battlefield effect nicknamed a \"Gravedigger,\" as that's the card that did it first. White usually returns creatures with smaller converted mana costs."},{"k":"return target enchantment from graveyard to hand","l":"Return target enchantment from graveyard to hand.","c":{"W":["primary","both-agree"]},"f":"graveyard","s":[],"x":false,"a":[],"e":"Getting back enchantments is primarily a white thing."},{"k":"return target instant from graveyard to hand","l":"Return target instant from graveyard to hand.","c":{"U":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"graveyard","s":[],"x":false,"a":[],"e":"As blue and red are the spell colors (they have the highest percentage of spells versus creatures), they are the two colors that can get instants back. When there is a choice to separate them, blue leans toward getting back instants and red leans toward getting back sorceries."},{"k":"return target land from graveyard to hand","l":"Return target land from graveyard to hand.","c":{"G":["primary","both-agree"]},"f":"graveyard","s":[],"x":false,"a":[],"e":"While green can get back any card, when the card types are divvied up, green often gets back lands."},{"k":"return target sorcery from graveyard to hand","l":"Return target sorcery from graveyard to hand.","c":{"U":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"graveyard","s":[],"x":false,"a":[],"e":"This is the same as for getting back instants."},{"k":"return to hand","l":"Return to hand (Return target creature/permanent to its owner's hand.)","c":{"W":["secondary","both-agree"],"U":["primary","both-agree"],"G":["tertiary","ability-catalog-only"]},"f":"tempo","s":[],"x":true,"a":[],"e":"Blue can bounce any type of permanent, although these days doesn't often bounce lands. It also will often bounce a creature via an enters-the-battlefield effect. (R&D refers to these as \"[autocard mvid=\"413601\"]Man-o'-Wars,\" based on the first card that did it.) White can only bounce its own permanents to protect them (and often to do cool combo-ish things). Green bounces creatures as a cost for playing bigger creatures."},{"k":"return to library","l":"Return to library (Put a creature/permanent on top of its owner's library or some number of cards down.)","c":{"U":["primary","both-agree"]},"f":"tempo","s":[],"x":false,"a":[],"e":"Blue does this as an upgraded version of returning to hand. Blue will sometimes put the card a few cards down into the library and sometimes shuffles it into a small pile on top. White used to also do this, but it has been removed from white."},{"k":"rewards for death","l":"Rewards for death (Whenever another creature/creature you control dies . . . )","c":{"W":["secondary","both-agree"],"B":["primary","both-agree"],"R":["tertiary","both-agree"]},"f":"protection","s":[],"x":true,"a":[],"e":"Black is the color that most triggers off of other things dying, usually flavored as gaining strength from others' pain. White usually gains life, creates a token creature, or helps the creature go somewhere other than the graveyard, often your hand. Red tends to create creature tokens or deal damage."},{"k":"rules setting","l":"Rules setting","c":{"W":["primary","both-agree"],"U":["secondary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["secondary","both-agree"]},"f":"rules_alteration","s":[],"x":true,"a":[],"e":"These cards are permanents, mostly creatures and enchantments, that change some basic rule of the game. Every color has some amount of access to do this, but white does it at the highest volume."},{"k":"rummaging (discard a card and draw a card.)","l":"\"Rummaging\" (Discard a card and draw a card.)","c":{"R":["primary","both-agree"]},"f":"disruption","s":[],"x":false,"a":[],"e":"Red has its version of \"looting\" (see looting), but its recklessness has it discard the card before drawing."},{"k":"sacrifice a creature and deal damage to creature/planeswalker/player equal to the sacrificed creature's power/toughness","l":"Sacrifice a creature and deal damage to creature/planeswalker/player equal to the sacrificed creature's power/toughness.","c":{"B":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"sacrifice","s":["removal"],"x":false,"a":["Sacrifice a creature and deal damage to creature/player equal to the sacrificed creature's power/toughness."],"e":"In red, this is flavored as throwing the creatures. In black, it's more treated as a sacrifice for a ritual."},{"k":"sacrifice a land","l":"Sacrifice a land.","c":{"R":["primary","both-agree"]},"f":"sacrifice","s":[],"x":false,"a":[],"e":"Red is the color most likely to sacrifice lands."},{"k":"sacrifice a permanent","l":"Sacrifice a permanent.","c":{"B":["secondary","both-agree"],"R":["primary","both-agree"]},"f":"sacrifice","s":[],"x":false,"a":[],"e":"Red is the color most likely to sacrifice any permanent as it's the color that can individually sacrifice them all. We are letting black do this a little more."},{"k":"sacrifice a permanent :: sacrifice a creature","l":"Sacrifice a creature.","c":{"B":["primary","both-agree"],"R":["primary","both-agree"]},"f":"sacrifice","s":[],"x":false,"a":["Sacrifice a creature.","Sacrifice a creature. (Target player/all player(s) sacrifice a creature.)"],"e":"Black and red are the two most likely colors to sacrifice creatures. This is often part of a draft archetype."},{"k":"sacrifice a permanent :: sacrifice an artifact","l":"Sacrifice an artifact.","c":{"B":["primary","both-agree"],"R":["primary","both-agree"]},"f":"sacrifice","
