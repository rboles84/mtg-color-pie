s":[],"x":false,"a":["Sacrifice an artifact.","Sacrifice an artifact. (Target/all player(s) sacrifice an artifact.)"],"e":"Black and red are the most likely to sacrifice artifacts to generate an effect."},{"k":"sacrifice an enchantment","l":"Sacrifice an enchantment.","c":{"R":["primary","both-agree"],"G":["primary","both-agree"]},"f":"sacrifice","s":[],"x":true,"a":[],"e":"Red and green are the two colors that most often sacrifice enchantments. This only tends to get used in sets with enchantment themes."},{"k":"scry","l":"Scry","c":{"W":["secondary","both-agree"],"U":["primary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["secondary","both-agree"]},"f":"card_flow","s":[],"x":false,"a":[],"e":"All colors have access to scry but blue gets the most. Blue also gets the largest scry numbers with red getting the lowest."},{"k":"sengir ability","l":"\"Sengir\" ability (When a creature damaged by this creature dies, put a +1/+1 counter on this creature.)","c":{"B":["primary","both-agree"]},"f":"life","s":[],"x":true,"a":[],"e":"This ability appeared in Limited Edition (Alpha) on Sengir Vampire and gets used occasionally in black. Because it doesn't often result in the creature getting +1/+1 counters, we now often do variations of it."},{"k":"specter ability","l":"\"Specter\" ability (When this creature deals combat damage to an opponent, that player discards a card.)","c":{"B":["primary","both-agree"]},"f":"disruption","s":[],"x":false,"a":[],"e":"This ability is often tied to the Specter creature type. Just as the \"curiosity\" ability is in the card drawing color, so too is the \"Specter\" ability in the discard color, black."},{"k":"spell copying","l":"Spell copying (Copy target instant or sorcery spell. You may choose new targets for the copy.)","c":{"U":["primary","both-agree"],"R":["primary","both-agree"]},"f":"copying","s":[],"x":true,"a":[],"e":"This ability is mostly done at rare. We bounced back and forth between whether blue or red was supposed to do it and finally let them both do it."},{"k":"spell redirection","l":"Spell redirection (Change the target of target spell and/or ability with a single target.)","c":{"U":["primary","both-agree"],"R":["primary","both-agree"]},"f":"combat","s":[],"x":false,"a":[],"e":"The same thing happened with spell redirection as spell copying, and we ended up with the same solution—letting both colors do it. We've started letting some of these effects redirect abilities as well as spells."},{"k":"stalking","l":"\"Stalking\" (This creature can't be blocked by more than one creature.)","c":{"G":["primary","both-agree"]},"f":"evasion","s":[],"x":true,"a":[],"e":"This is usually used on creatures 3/3 or bigger."},{"k":"stealing permanents, permanently","l":"Stealing permanents, permanently","c":{"U":["primary","both-agree"],"B":["tertiary","both-agree"]},"f":"theft","s":["removal"],"x":true,"a":[],"e":"Blue is the main color to gain control of other players' permanents. It can steal any type of permanent but most often steals creatures. Black is allowed to steal things infrequently. Red also steals but only temporarily (see below)."},{"k":"stealing permanents, temporarily","l":"Stealing permanents, temporarily","c":{"R":["primary","both-agree"]},"f":"theft","s":["removal"],"x":true,"a":[],"e":"Red takes control of permanents, mostly creatures, for the turn, gives them haste, and then returns them at end of turn."},{"k":"super trample","l":"\"Super trample\" (You may have this creature assign combat damage as though it weren't blocked.)","c":{"G":["primary","both-agree"]},"f":"stat_modification","s":["combat"],"x":false,"a":[],"e":"We don't do this ability very often, but when we do, we do it in green."},{"k":"switch power/toughness","l":"Switch power/toughness","c":{"U":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":false,"a":["Switching power/toughness"],"e":"Blue does this most often, but red does it on occasion. Sometimes this is on creatures that can switch their own power and toughness."},{"k":"tapping creatures","l":"Tapping creatures","c":{"W":["primary","both-agree"],"U":["secondary","both-agree"]},"f":"tempo","s":[],"x":true,"a":[],"e":"White is the main color of tapping creatures. Blue usually taps creatures only when also given the ability to untap them. (See twiddle.) The one exception is when it \"freezes\" creatures. (See freezing.)"},{"k":"taxing","l":"Taxing","c":{"W":["primary","both-agree"],"U":["secondary","both-agree"]},"f":"control","s":[],"x":true,"a":[],"e":"Taxing cards are ones that force the opponent to pay some cost to do an activity they could normally do without an additional cost. Taxing cards are most often creatures and enchantments, but occasionally are done as one-shot spells. Most of blue's taxing has gone to white (it used to be primary in blue), but blue still gets taxing counterspells (such as Mana Leak)."},{"k":"time walk (take an extra turn after this one.)","l":"\"Time Walk\" (Take an extra turn after this one.)","c":{"U":["primary","both-agree"],"R":["tertiary","both-agree"]},"f":"tempo","s":[],"x":true,"a":[],"e":"Blue is the main color to take extra turns. It usually does it at mythic rare. Red on rare occasion will do a \"[autocard mvid=\"383131\"]Time Walk\" that comes with some big penalty—often losing the game at the end of the extra turn."},{"k":"token generation","l":"Token generation","c":{"W":["primary","both-agree"],"U":["secondary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"tokens","s":[],"x":true,"a":[],"e":"All colors can make creature tokens. White and green, as the two main creature colors, do it most often. White tends to make smaller creature tokens, usually 1/1s, while green tends to make larger ones, from 3/3 and up. White often will make multiple tokens at once since they're smaller. Black most often makes 2/2 Zombies. Red most often makes 1/1 Goblins. Sometimes red's token creatures are a little bigger and get exiled at end of turn."},{"k":"torment ability","l":"\"Torment\" ability (Target player sacrifices a nonland permanent, pays 3 life, or discards a card.)","c":{"B":["primary","both-agree"]},"f":"disruption","s":[],"x":false,"a":[],"e":"We've been playing around with an ability giving the opponent some options of what to pay. This ability is being used in black."},{"k":"trample","l":"Trample","c":{"W":["tertiary","both-agree"],"U":["tertiary","both-agree"],"B":["tertiary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"evasion","s":["combat"],"x":false,"a":[],"e":"Green is the main trample color, but red's share has been growing over time. Any color is allowed access to trample if the creature is large enough and of a higher rarity."},{"k":"transformation","l":"\"Transformation\" (Target creature becomes a (color) (card type) with N power and N toughness.)","c":{"U":["primary","both-agree"]},"f":"characteristic_change","s":[],"x":true,"a":[],"e":"Transformation can be temporary, through a one-shot spell that lasts for the turn, or more permanent, usually through an Aura. It overwrites the base power and toughness of the creature. This ability used to be in both blue and white, but we decided to focus it in blue. Sometimes blue can overwrite what the creature is currently doing and just make it the \"transformed\" creature. The one thing that we've taken from blue is destroying or exiling a creature and then giving the controller of that creature a creature token as a means of flavoring transformation. That is now a white ability flavored as giving compensation for destroying/exiling the creature. This means all of blue's transformation abilities are auras or limited effects on spells or activations."},{"k":"treasure creation","l":"Treasure creation (artifact tokens with \"T, Sacrifice this artifact: Add one mana of any color.\")","c":{"U":["tertiary","both-agree"],"B":["secondary","both-agree"],"R":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"mana","s":["tokens"],"x":true,"a":[],"e":"As the color of temporary mana, red is best at treasure creation. Black and green can both make treasure, but black tends to usually require some additional cost. Green historically has not had a lot of treasure making cards, but it's squarely in pie for green to do so. For flavor reasons, like Pirates, blue occasionally creates Treasure."},{"k":"tutor for a creature","l":"\"Tutor\" for a creature.","c":{"W":["secondary","both-agree"],"U":["secondary","both-agree"],"B":["secondary","both-agree"],"R":["secondary","both-agree"],"G":["primary","both-agree"]},"f":"tutoring","s":["card_flow"],"x":false,"a":[],"e":"Green is the main color to tutor for creatures. Sometimes it will even put them directly onto the battlefield. All colors have access to tutoring for specific creature types that are in their color. Red, for example, can tutor for Dragons."},{"k":"tutor for a land","l":"\"Tutor\" for a land.","c":{"W":["tertiary","both-agree"],"U":["tertiary","both-agree"],"B":["tertiary","both-agree"],"R":["tertiary","both-agree"],"G":["primary","both-agree"]},"f":"tutoring","s":["card_flow"],"x":true,"a":[],"e":"Green, being one of the colors most closely associated with land and mana, is the best at tutoring for land. It occasionally will put them directly onto the battlefield. The other four colors are allowed to occasionally tutor for their own basic land type. White is getting more tutoring for a Plains as a catch-up feature when it's behind on land."},{"k":"tutor for a planeswalker","l":"\"Tutor\" for a planeswalker.","c":{"W":["primary","both-agree"]},"f":"tutoring","s":["card_flow"],"x":false,"a":[],"e":"White is the color that cares the most about planeswalkers, so it's the color that can tutor for them."},{"k":"tutor for an artifact","l":"\"Tutor\" for an artifact.","c":{"W":["secondary","both-agree"],"U":["primary","both-agree"]},"f":"tutoring","s":["card_flow"],"x":true,"a":[],"e":"Blue can go get any type of artifact. White tends to focus on certain subsets such as Equipment and Vehicles."},{"k":"tutor for an enchantment","l":"\"Tutor\" for an enchantment.","c":{"W":["primary","both-agree"]},"f":"tutoring","s":["card_flow"],"x":false,"a":[],"e":"White is the color that searches the library for enchantments."},{"k":"tutor for an instant or sorcery","l":"\"Tutor\" for an instant or sorcery.","c":{"U":["primary","both-agree"],"R":["secondary","both-agree"]},"f":"tutoring","s":["card_flow"],"x":true,"a":[],"e":"When tutoring, the two spell types are often put together and blue seeks them out. We occasionally let red search out red instants and sorceries (usually to get things like direct damage spells)."},{"k":"tutor for any card","l":"\"Tutor\" for any card.","c":{"B":["primary","both-agree"]},"f":"tutoring","s":["card_flow"],"x":false,"a":[],"e":"Limited Edition (Alpha) had the card [autocard mvid=\"394025\"]Demonic Tutor, which locked in black as the color to tutor for any type of card. There's been much talk over the years that blue seems philosophically the better color to have this ability, but so far no changes have been made."},{"k":"twiddle","l":"\"Twiddle\" (Tap or untap target creature/permanent.)","c":{"U":["primary","both-agree"]},"f":"tempo","s":[],"x":true,"a":[],"e":"Ever since the card [autocard mvid=\"45235\"]Twiddle appeared in Limited Edition (Alpha), blue has had the ability to tap or untap permanents. It's most often used just on creatures. Blue doesn't tend to just tap or just untap, but rather give you the choice between the two. The one exception is \"freezing\" where it taps creatures and keeps them from untapping for a turn. (See freezing.)"},{"k":"untapping creatures","l":"Untapping creatures","c":{"W":["secondary","both-agree"],"U":["primary","both-agree"],"G":["primary","both-agree"]},"f":"tempo","s":[],"x":true,"a":[],"e":"Untapping creatures used to be white's domain, but we moved individual creature untapping off to green to give it more creature answers. White still can untap all your creatures or an individual creature on a spell that's defined as solely defensive. Blue's ability to untap is usually accompanied by its ability to also tap (see twiddle above)."},{"k":"untapping lands","l":"Untapping lands","c":{"U":["tertiary","both-agree"],"G":["primary","both-agree"]},"f":"mana","s":["tempo"],"x":false,"a":[],"e":"Green, as the color most in tune with lands and acquiring mana, is the color that most often untaps lands. Blue does this a little."},{"k":"untaps itself","l":"Untaps itself","c":{"W":["secondary","both-agree"],"U":["primary","both-agree"]},"f":"tempo","s":[],"x":true,"a":[],"e":"This is a creature that has an activated ability (or sometimes a triggered ability) that untaps itself. It's mostly used in blue, but occasionally in white when we want to simulate vigilance because actual vigilance is problematic due to timing."},{"k":"variable creature","l":"Variable Creature (This creature enters the battlefield with X +1/+1 counters.)","c":{"B":["tertiary","ability-catalog-only"],"R":["tertiary","ability-catalog-only"],"G":["primary","both-agree"]},"f":"counters","s":[],"x":false,"a":[],"e":"This is a creature with an X in its cost determining how big it's going to be."},{"k":"vigilance","l":"Vigilance","c":{"W":["primary","both-agree"],"U":["secondary","both-agree"],"G":["secondary","both-agree"]},"f":"combat","s":[],"x":true,"a":[],"e":"White tends to get this on creatures where the power is equal to or less than the toughness, and seldom with a power greater than 3. Green tends to get this ability on larger creatures to differentiate it from white. We've recently decided to also make blue secondary in vigilance because we were looking for more creature abilities to use in blue. We're still feeling out what kind of blue creatures will get vigilance."},{"k":"ward (for life)","l":"Ward (for life)","c":{"B":["primary","both-agree"],"R":["primary","both-agree"]},"f":"protection","s":[],"x":false,"a":[],"e":"While white, blue, and green get to have ward using mana, black and red get to use it with a life payment instead. Black can also ward for discard."},{"k":"ward (for mana)","l":"Ward (for mana)","c":{"W":["primary","both-agree"],"U":["primary","both-agree"],"G":["primary","both-agree"]},"f":"protection","s":[],"x":false,"a":[],"e":"Ward is a new evergreen ability. It makes any opponent who wishes to target the item with ward pay an additional cost. The most common way we use this is ward for mana, and that's in white, blue and green. It's in white because it's both the most protective and taxing color; and it's in blue and green, flavored as antimagic, in places where hexproof used to be."},{"k":"warlord","l":"\"Warlord\" (This creature's power and toughness is equal to the number of creatures you control.)","c":{"W":["primary","both-agree"],"G":["secondary","both-agree"]},"f":"stat_modification","s":[],"x":true,"a":[],"e":"This ability started in red with Keldon Warlord in Limited Edition (Alpha). We later moved it into green, as green is the creature color. The ability then got moved into white because white is the army color that likes giving rewards for having lots of little creatures. We still do the ability a little in green, but it's mostly in white these days."},{"k":"wheeling","l":"\"Wheeling\" (All players discard their hand and draw N cards.)","c":{"R":["primary","both-agree"]},"f":"disruption","s":[],"x":false,"a":[],"e":"There's a big debate in R&D as to whether this is supposed to be a red ability. It obviously goes all the way back to Limited Edition (Alpha) with Wheel of Fortune, but it's a raw form of card advantage that's supposed to be something red is bad at. For now, it stays in red's part of the color pie."},{"k":"word changing","l":"Word Changing (Change a word in rules text into another word from the same subset.)","c":{"U":["primary","both-agree"]},"f":"characteristic_change","s":[],"x":false,"a":[],"e":"This isn't an ability we do often any more, but it's blue when we do it. The most common use is changing a color word (white, blue, black, red, or green) for another color word or changing a basic land type (Plains, Island, Swamp, Mountain, or Forest) for another basic land type."},{"k":"you don't lose","l":"\"You don't lose\" (Permanents that prevent you from losing the game while they're on the battlefield, usually with an alternate means to lose.)","c":{"W":["secondary","both-agree"],"B":["primary","both-agree"]},"f":"win_condition","s":[],"x":true,"a":[],"e":"This started with Lich in Limited Edition (Alpha) and has continued to be used on rare occasion. More recently, white has also started using this ability, often with the flavor of protecting the player."}],"adjudications":[{"mech":"+n/+n (on spells)","color":"W","tier":"primary","basis":"adjudicated","conflict":{"colour_list_says":"secondary","ability_catalog_says":"primary"},"ruling":{"tier":"primary","authority":"companion change log, 2021-10-18","mechanism":"The change log records White as primary in 2017 as well, so the White-Secondary list entry contradicts both editions."}},{"mech":"-n/+n (on auras)","color":"W","tier":"primary","basis":"colour-list-only","conflict":null,"ruling":null},{"mech":"-n/+n (on spells)","color":"W","tier":"primary","basis":"colour-list-only","conflict":null,"ruling":null},{"mech":"-n/-0 (on creatures)","color":"U","tier":"primary","basis":"colour-list-only","conflict":null,"ruling":null},{"mech":"creature pumping, your team, ongoing :: +n/+0 to your team","color":"B","tier":"tertiary","basis":"adjudicated","conflict":{"colour_list_says":"secondary","ability_catalog_says":"tertiary"},"ruling":{"tier":"tertiary","authority":"ability catalog","mechanism":"Persistent summary/catalog inconsistency in BOTH 2017 and 2021. The detailed catalog says tertiary and no 2021 change is recorded, so the Black-Secondary summary claim is a l const CS = ['W','U','B','R','G'];
const CN = {W:'White',U:'Blue',B:'Black',R:'Red',G:'Green'};
const TIER_ORDER = {primary:3, secondary:2, tertiary:1};

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = n => (n == null ? '' : Number(n).toLocaleString('en-US'));
const pct = (a,b) => b ? (100*a/b).toFixed(1)+'%' : '—';
const dot = c => `<span class="c c${c}" title="${CN[c]}">${c}</span>`;
const dots = v => `<span class="chips">${(typeof v === 'string' ? v.split('') : v || []).map(dot).join('')}</span>`;
const kb = b => b >= 1024 ? (b/1024).toFixed(b>10240?0:1)+' KB' : b+' B';
const el = (tag, html) => { const e = document.createElement(tag); e.innerHTML = html; return e; };

function table(cols, rows, opts) {
  opts = opts || {};
  const head = '<thead><tr>' + cols.map(c =>
    `<th scope="col" class="${c.n?'n':''}">${esc(c.h)}</th>`).join('') + '</tr></thead>';
  const body = '<tbody>' + rows.map(r => '<tr>' + cols.map(c => {
    // c.f returns trusted HTML the caller has already escaped; the c.k path
    // reads a raw payload value, so it is escaped here.
    const v = c.f ? c.f(r) : esc(r[c.k]);
    return `<td class="${c.n?'n':''} ${c.cls||''}">${v == null ? '' : v}</td>`;
  }).join('') + '</tr>').join('') + '</tbody>';
  return `<div class="tbl-wrap${opts.max?' scrolls':''}"${opts.max?` style="max-height:${opts.max};overflow:auto"`:''}>
    <table>${head}${body}</table></div>`;
}

function heat(v, max, label) {
  const a = max ? v / max : 0;
  const bg = `background:color-mix(in srgb, var(--accent) ${Math.round(a*55)}%, transparent)`;
  return `<td class="heat" style="${bg}"><span>${label === undefined ? num(v) : label}</span></td>`;
}

    a.ruling && /unchanged since|BOTH 2017/i.test(a.ruling.mechanism)).length;

  const items = [
    ['Colour breadth does not decay — it dips at four and rebounds at five.',
     `The sequence is ${b['1'].n} → ${b['2'].n} → ${b['3'].n} → <b>${b['4'].n}</b> → <b>${b['5'].n}</b>. Four-colour mechanics are the single rarest bucket (${b['4'].n} of 216, ${b['4'].pct}%); five-colour mechanics are ${(b['5'].n/b['4'].n).toFixed(1)}× more common and rank ${bRank.indexOf('5')+1}${['st','nd','rd','th','th'][bRank.indexOf('5')]} of the five buckets. The design language is "one or two colours own this" or "this is universal", with a real trough between. Any visualisation implying a smooth gradient from narrow to broad misrepresents the corpus.`],
    ['Reachability hides structure. Ratios reveal it.',
     `Blue and Black both reach 94 mechanics and are structurally nothing alike. Blue runs ${(pc.U.primary/pc.U.secondary).toFixed(2)} primaries per secondary; Black runs ${(pc.B.primary/pc.B.secondary).toFixed(2)}. Black's presence in the pie is disproportionately as a supporting tier rather than an owner. One number says they are twins; the other says they are opposites.`],
    ['Almost half the corpus carries a restriction.',
     `${L.conditional} of 216 mechanics (${pct(L.conditional,216)}) are conditional. That is far too many for conditionality to work as a navigation bucket — it is a property of most records, not a category of some. It belongs as a badge on a record, which is exactly what the contract already requires.`],
    ['The conditional rate is not uniform across families.',
     `Ignoring families with fewer than five members, it ranges from ${realCond[0].r.toFixed(0)}% of <code>${esc(realCond[0].f)}</code> (${realCond[0].c}/${realCond[0].t}) up to ${realCond[realCond.length-1].r.toFixed(0)}% of <code>${esc(realCond[realCond.length-1].f)}</code> (${realCond[realCond.length-1].c}/${realCond[realCond.length-1].t}) — a ${(realCond[realCond.length-1].r/realCond[0].r).toFixed(1)}× spread. Restriction density is a real family-level signal and it is currently not surfaced anywhere.`],
    ['Co-ownership is rare; shared access is common.',
     `Any-access pair overlaps run ${Math.min(...anyOv)}–${Math.max(...anyOv)}. Shared-<i>primary</i> overlaps run ${Math.min(...spOv)}–${Math.max(...spOv)} — an order of magnitude smaller. Two colours holding the same mechanic at primary is genuinely unusual. A UI that only distinguishes "reachable / not reachable" will read as far more colour redundancy than the design contains.`],
    ['Redundancy is the largest single thing a colour adds — but not the majority of it.',
     `Summed across all ${D.marginal.length} additions, "same tier, new owner" occurs ${num(tSame)} times of ${num(tTot)} transitions (${pct(tSame,tTot)}). That is the largest single bucket, and ${(tSame/tUpgr).toFixed(1)}× every tier upgrade among already-reachable mechanics combined (${num(tUpgr)}). It is not, however, a majority: newly-reachable transitions total ${num(tNew)}. Adding a colour most often gives you a second way to do something you could already do — but it opens genuinely new ground nearly as often.`],
    ['No colour is load-bearing.',
     `Remove any single colour from WUBRG and at worst ${Math.max(...D.absence.map(a=>a.lost_completely))} of 216 mechanics are lost completely; four colours always reach at least 190. The "essential colour" narrative has no support in this snapshot.`],
    ['The family partition is heavily skewed.',
     `<code>${esc(F.slice().sort((x,y)=>y.canonical_family_members-x.canonical_family_members)[0].family)}</code> holds ${Math.max(...F.map(f=>f.canonical_family_members))} members; <code>tokens</code> holds 1. ${smallFams.length} families hold under five members each (${smallFams.map(f=>`<code>${esc(f.family)}</code>&nbsp;${f.canonical_family_members}`).join(', ')}). Equal-area family tiling would be visually tidy and factually misleading.`],
    ['The two sharpest colour signatures are exact mirror images.',
     `${topSpread.map(s => `<code>${esc(s.f)}</code> is ${CN[s.hiC]} ${s.hi} / ${CN[s.loC]} ${s.lo}`).join(' and ')} — ${topSpread.length > 1 ? `tied at a spread of ${topSpread[0].d}, the widest in the family table` : `a spread of ${topSpread[0].d}, the widest in the family table`}. ${topSpread.length === 2 && topSpread[0].hiC === topSpread[1].loC ? `The pair inverts cleanly: the colour that dominates one is the colour that is nearly absent from the other. If a single figure is going to teach someone what the colour pie means, this pair is it — either alone is only half the lesson.` : ''}`],
    ['One mechanic has no primary owner at all.',
     `<code>${esc(L.zero_primary.join(', '))}</code>. Every tier-derived aggregate has to survive this record, and any "who owns this" affordance needs a real empty state rather than a fallback to the strongest available tier.`],
    ['One mechanic has three primary owners.',
     `<code>${esc(L.three_primary.join(', '))}</code> — the maximum anywhere. Layouts that assume at most two primaries will break on exactly one record, which is the hardest kind of bug to catch by eye.`],
    ['The sources disagree more often than the tidy count suggests.',
     `${num(L.basis['both-agree'])} of ${num(Object.values(L.basis).reduce((a,b)=>a+b,0))} runtime assignments are unanimous, but ${D.adjudications.length} are not — ${num(L.basis.adjudicated)} of them are outright contradictions between the article's own summary lists and its own catalog. ${adjStale} of those is stale 2017 data that survived into the 2021 summary; ${adjUnchanged} more are long-standing summary-list errors that the change log shows were never corrected in either edition. The basis field is the most quietly valuable column in the whole directory.`],
    ['Registry names are not mechanical identities.',
     `${reg.total_registry_records} display names cover ${reg.unique_wubrg_color_sets_represented} distinct colour sets; ${reg.records_mapping_to_a_wubrg_subset} of them map to a WUBRG subset at all. ${Object.keys(reg.color_sets_with_more_than_one_registry_name).length} colour sets carry two names each. Counting names instead of sets would inflate a per-identity statistic by ${(100*(reg.records_mapping_to_a_wubrg_subset/reg.unique_wubrg_color_sets_represented-1)).toFixed(0)}% (${(100*(reg.total_registry_records/reg.unique_wubrg_color_sets_represented-1)).toFixed(0)}% if the unmappable record is counted too).`],
    ['Colorless is unmeasured, not zero.',
     `${esc(D.special.Colorless.reason)} The empty-selection result of 0 is an algorithmic artefact of the WUBRG projection and must never be shown as "0 mechanics".`],
  ];
  return `
  <p class="lede">Things the data says that the headline numbers do not. Each
  one is arithmetic over the accepted records — no interpretation of intent, no
  quality claims.</p>
  ${items.map((it,i) => `<details${i<3?' open':''}><summary>${it[0]}</summary>
    <p>${it[1]}</p></details>`).join('')}`;
});

/* 16 */
S('codebook', 'Codebook', () => {
  const d = D.definitions;
  return `
  <p class="lede">Frozen measurement definitions. These are not stylistic
  choices — several of them name populations that are easy to conflate, and the
  numbers in this dossier are only comparable to each other because these hold.</p>
  ${table([
    {h:'term', f:r => `<span class="mono">${esc(r[0])}</span>`},
    {h:'frozen meaning', f:r => esc(r[1])},
  ], Object.entries(d))}

  <h3>Record shape — <span class="mono">byMechanic</span></h3>
  <pre>${esc(JSON.stringify({
    label: 'human-readable name as printed',
    colors: {W: {tier: 'primary | secondary | tertiary', basis: 'both-agree | adjudicated | colour-list-only | ability-catalog-only'}},
    family: 'exactly one Vox family (canonical)',
    families_secondary: ['zero or more cross-links, discovery only'],
    source_aliases: ['other labels merged into this record'],
    explanation: "Rosewater's sentence, where the article gives one",
    has_restriction: 'boolean; the mechanic is conditional'
  }, null, 2))}</pre>

  <h3>What this dossier does not cover</h3>
  <p>Every file in <code>data/</code> is inventoried in section 3, but not every
  file's <i>contents</i> are reproduced here. Specifically:</p>
  <ul>
    <li>The four prose records — <code>mcp2021.audit.md</code>,
      <code>mcp2021.identity_review.md</code>, <code>mechanical_pie_review.md</code>
      and <code>recon.md</code> — are listed but not summarised. Read them directly.</li>
    <li>The L0 capture (<code>mechanical_pie_2021.json</code>) and the pre-merge
      join (<code>mcp2021.reconciled.raw.json</code>) are represented only by the
      counts they feed. Their per-record contents are not shown.</li>
    <li><code>data/recon/mechanics-statistics-recon.md</code> remains the
      authoritative narrative report. Where this dossier quotes a figure it comes
      from <code>mechanics-statistics.json</code>; where the two ever disagree,
      the recon corpus wins and this file is stale — regenerate it.</li>
    <li>Nothing here measures cards, sets, or play. The corpus is one article's
      tier assignments and a navigation index layered on top.</li>
  </ul>

  <h3>Caveats that travel with every number here</h3>
  <ul>
    <li>Tiers describe design ownership and frequency. They are never a score, never summed, never compared across mechanics as one unit.</li>
    <li>The snapshot is dated ${esc(D.meta.snapshot_date)}. Sets published since can and do override entries.</li>
    <li>Families are Vox-Mana vocabulary layered on top for navigation. They are not Rosewater's and carry no authority.</li>
    <li>Best access never replaces ownership: a selection reaching a mechanic at tertiary has access, not ownership.</li>
    <li>Counts of registry display names are not counts of mechanical identities.</li>
  </ul>`;
});

/* ------------------------------------------------------------------ render */
const main = document.getElementById('main');
const toc = document.getElementById('toc');
document.getElementById('navsub').textContent =
  D.meta.snapshot_date + ' snapshot · ' + D.inventory.length + ' files · generated ' + D.generated;

SECTIONS.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.id = s.id;
  sec.innerHTML = `<h2><span class="num">${i+1}</span>${esc(s.title)}</h2>` + s.build();
  main.appendChild(sec);
  toc.appendChild(el('li', `<a href="#${s.id}">${esc(s.title)}</a>`));
});
main.appendChild(el('div', `<div class="foot">
  Generated by <code>tools/build_dossier.py</code> on ${esc(D.generated)}.
  Read-only over <code>data/</code>. Re-run the script after any change upstream.
  Source: ${esc(D.meta.document)}, ${esc(D.meta.author)},
  <a href="${esc(D.meta.url)}" rel="noreferrer">${esc(D.meta.url)}</a>.
</div>`));

/* mechanic browser */
(function () {
  const list = document.getElementById('mechlist');
  const q = document.getElementById('q'), fc = document.getElementById('fc'),
        ff = document.getElementById('ff'), fx = document.getElementById('fx'),
        fb = document.getElementById('fb'), qc = document.getElementById('qc');
  const card = m => {
    const tiers = CS.filter(c => m.c[c]).sort((a,b) =>
      TIER_ORDER[m.c[b][0]] - TIER_ORDER[m.c[a][0]]);
    return `<div class="mech">
      <div class="hd"><span class="nm">${esc(m.l)}</span>
        <span class="chips">${tiers.map(c => {
          const [t, basis] = m.c[c];
          const flag = basis !== 'both-agree' ? ' ⚑' : '';
          return `<span class="chip" title="${esc(basis)}">${dot(c)}<span class="t-${t}">${t}${flag}</span></span>`;
        }).join('')}</span>
      </div>
      ${m.e ? `<div class="ex">${esc(m.e)}</div>` : ''}
      <div class="mt">
        <span class="pill">${esc(m.f)}</span>
        ${m.s.map(s => `<span class="pill dim">↔ ${esc(s)}</span>`).join('')}
        ${m.x ? '<span class="pill">conditional</span>' : ''}
        ${m.a.length ? `<span class="dim mono">alias: ${esc(m.a.join(' · '))}</span>` : ''}
        <span class="dim mono">${esc(m.k)}</span>
      </div></div>`;
  };
  const apply = () => {
    const s = q.value.trim().toLowerCase();
    const [cc, ct] = (fc.value || '').split(':');
    const fam = ff.value, xr = fx.value, bs = fb.value;
    const out = D.mechanics.filter(m => {
      if (s && !(m.l + ' ' + m.k + ' ' + m.f + ' ' + m.s.join(' ') + ' ' + m.e)
        .toLowerCase().includes(s)) return false;
      if (cc && !m.c[cc]) return false;
      if (cc && ct && m.c[cc][0] !== ct) return false;
      if (fam && m.f !== fam && !m.s.includes(fam)) return false;
      if (xr === '1' && !m.x) return false;
      if (xr === '0' && m.x) return false;
      if (bs && !CS.some(c => m.c[c] && m.c[c][1] === bs)) return false;
      return true;
    });
    qc.textContent = out.length + ' of ' + D.mechanics.length;
    list.innerHTML = out.length ? out.map(card).join('')
      : '<p class="dim">No mechanic matches those filters.</p>';
  };
  [q, fc, ff, fx, fb].forEach(e => e.addEventListener('input', apply));
  apply();
})();

/* marginal additions */
(function () {
  const wrap = document.getElementById('mtbl'), mf = document.getElementById('mf'),
        ma = document.getElementById('ma'), mc = document.getElementById('mc');
  const apply = () => {
    const s = mf.value.trim().toUpperCase(), a = ma.value;
    const rows = D.marginal.filter(r =>
      (!a || r.added === a) && (!s || (r.base + r.added + r.result).toUpperCase().includes(s)));
    mc.textContent = rows.length + ' of ' + D.marginal.length;
    wrap.innerHTML = table([
      {h:'base', f:r => `${dots(r.base.split(''))} <span class="mono">${esc(r.base)}</span>`},
      {h:'add', f:r => dot(r.added)},
      {h:'result', f:r => `<span class="mono">${esc(r.result)}</span>`},
      {h:'newly reachable', n:true, f:r => `<b>${r.newly_reachable}</b>`},
      {h:'best tier improved', n:true, k:'best_tier_improved'},
      {h:'new owner, no gain', n:true, k:'new_owner_no_improvement'},
      {h:'unchanged', n:true, k:'unchanged'},
      {h:'still unavailable', n:true, k:'still_unavailable'},
    ], rows, {max:'480px'});
  };
  [mf, ma].forEach(e => e.addEventListener('input', apply));
  apply();
})();

/* scrollspy */
(function () {
  const links = [...toc.querySelectorAll('a')];
  const secs = SECTIONS.map(s => document.getElementById(s.id));
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const i = secs.indexOf(e.target);
      links.forEach((a, j) => a.classList.toggle('on', i === j));
    });
  }, {rootMargin: '-10% 0px -80% 0px'});
  secs.forEach(s => io.observe(s));
})();
</script>
</body>
</html>
